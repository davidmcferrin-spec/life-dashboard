; /etc/php/<ver>/fpm/pool.d/lifedash.conf — installed by deploy/provision.sh
;
; Runs as the unprivileged `lifedash` user. That user maps to the `lifedash`
; PostgreSQL role through peer authentication on the Unix socket, so the app
; needs no database password.

[lifedash]
user  = lifedash
group = lifedash

listen       = /run/php/lifedash.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = ondemand
pm.max_children      = 12
pm.process_idle_timeout = 30s
pm.max_requests      = 500

request_terminate_timeout = 150s
catch_workers_output      = yes
decorate_workers_output   = no
clear_env                 = yes

php_admin_value[error_log]           = /srv/lifedash/app/storage/logs/php-error.log
php_admin_flag[log_errors]           = on
php_admin_flag[display_errors]       = off
php_admin_value[memory_limit]        = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M
php_admin_value[max_execution_time]  = 120
php_admin_value[session.save_path]   = /srv/lifedash/app/storage/sessions
; Ubuntu's session-cleanup cron only sweeps /var/lib/php/sessions, so let PHP GC this path.
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor]     = 100
php_admin_value[session.gc_maxlifetime] = 86400
php_admin_value[open_basedir]        = /srv/lifedash/app:/run/lifedash:/tmp:/usr/share/php:/var/lib/lifedash/deploy:/usr/bin/git
php_admin_value[date.timezone]       = UTC

; OPcache: code only changes on deploy, and lifedash-deploy reloads FPM.
; (Shared-memory sizing is PHP_INI_SYSTEM — see deploy/php/99-lifedash.ini.)
php_admin_value[opcache.validate_timestamps] = 0
